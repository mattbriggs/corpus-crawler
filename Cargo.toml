[workspace]
resolver = "2"
members = [
    "crates/crawl-domain",
    "crates/crawl-protocol",
    "crates/crawl-application",
    "crates/crawl-infrastructure",
    "crates/crawl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mattbriggs/corpus-crawler"
authors = ["Matt Briggs"]

[workspace.dependencies]
crawl-domain = { path = "crates/crawl-domain" }
crawl-protocol = { path = "crates/crawl-protocol" }
crawl-application = { path = "crates/crawl-application" }
crawl-infrastructure = { path = "crates/crawl-infrastructure" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
csv = "1.3"
indexmap = { version = "2", features = ["serde"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
