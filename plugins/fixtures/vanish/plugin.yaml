api_version: "1"
plugin:
  name: fixture-vanish
  version: "1.0.0"
  description: "Contract test fixture: deletes its siblings mid-crawl"
runtime:
  type: python
  command: ["python3", "worker.py"]
input:
  extensions: [".txt"]
output:
  format: records
  schema:
    filename:
      type: string
      required: true
    line:
      type: integer
      required: true
    text:
      type: string
      required: false
